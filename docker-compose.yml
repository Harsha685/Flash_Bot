services:
  flashbot:
    build: .
    # Privileged access and /dev are required for USB hotplug and serial uploads.
    privileged: true
    network_mode: host
    stdin_open: true
    tty: true
    volumes:
      - /dev:/dev
      - /run/udev:/run/udev:ro
      - ./sketches:/workspace/sketches
      - ./config:/workspace/config
      - ./logs:/workspace/logs
      - ./build:/workspace/build
      - pio:/root/.platformio

volumes:
  pio:
