; Example PlatformIO project for FlashBot.
; Each [env:...] section is offered for any connected board whose
; PlatformIO board ID matches its "board" value.

[platformio]
default_envs = esp32dev

[env]
framework = arduino
monitor_speed = 115200

[env:esp32dev]
platform = espressif32
board = esp32dev

[env:uno_r4_wifi]
platform = renesas-ra
board = uno_r4_wifi
